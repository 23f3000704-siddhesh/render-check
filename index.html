<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification Test - Round 3</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --border: #e5e5e5;
      --panel: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eaeaea;
        --muted: #a0a0a0;
        --border: #262626;
        --panel: #1a1a1a;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }
    main {
      flex: 1;
      padding: 2rem 1.25rem;
      display: grid;
      place-items: start;
      gap: 1rem;
    }
    .card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 10px;
      padding: 1rem;
      max-width: 720px;
      width: 100%;
    }
    .card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }
    .card p {
      margin: 0.25rem 0;
      color: var(--muted);
    }
    footer {
      margin-top: auto;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sample Page</h1>
  </header>

  <main>
    <div class="card">
      <h2>Task</h2>
      <p>This page demonstrates appending a small footer at the bottom of the page.</p>
    </div>
  </main>

  <footer>
    Verification test completed successfully - Round 3
  </footer>
</body>
</html>
